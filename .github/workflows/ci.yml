name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Vite+ 工具链
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version: "1.2.0"
          node-version: "22.22.2"
          package-manager: true
          run-install: false
          cache: true
          cache-toolchain: true

      - name: 安装锁定依赖
        run: vp install --frozen-lockfile

      - name: 检查运行环境与浏览器
        run: |
          node --version
          vp --version
          vp env doctor
          reqvia_chrome_bin="$(command -v google-chrome)"
          printf 'CHROME_BIN=%s\n' "$reqvia_chrome_bin" >> "$GITHUB_ENV"
          "$reqvia_chrome_bin" --version

      - name: 构建、静态检查与测试
        run: vp run ready

      - name: 验证浏览器传输
        run: vp run verify:browser

      - name: 验证 Node、Web 与 UniApp H5 消费端
        run: vp run verify:examples
